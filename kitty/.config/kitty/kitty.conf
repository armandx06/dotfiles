############################
### Fuente y Rendimiento ###
############################

font_family      CaskaydiaCove NF
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

sync_to_monitor  yes
repaint_delay    6
input_delay      1

########################
### Diseño y Ventana ###
########################

remember_window_size    no
initial_window_width    950
initial_window_height   550
enable_audio_bell       no
confirm_os_window_close 0

background_opacity         0.85
background_blur            1
dynamic_background_opacity yes

mouse_hide_wait                     3.0
focus_follows_mouse                 no
terminal_select_by_words_characters (@-./_~?&=%+#)

clear_all_shortcuts no

#########################
### Paleta de Colores ###
#########################

background            #1b222c
foreground            #d8dee9
selection_foreground  #1b222c
selection_background  #88c0d0
url_color             #8fbcbb
cursor                #81a1c1
cursor_text_color     #1b222c

color0  #2e3440
color8  #4c566a

color1  #bf616a
color9  #bf616a

color2  #a3be8c
color10 #a3be8c

