################
### MONITORS ###
################

# monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, disabled
monitor = DP-1, 2560x1440@143.97301, 1920x0, auto
# monitor = DP-1, disabled

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$browser = firefox
$menu = wofi --show drun

############################
### ENVIROMENT VARIABLES ###
############################

env = HYPRSHOT_DIR, /home/armandx06/Imágenes/Screenshots

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = waybar & swaync & hypridle
exec-once = kitty & firefox

###############
### GENERAL ###
###############

master {
new_status = master
}
misc {
force_default_wallpaper = -1
disable_hyprland_logo = false
}
general {
gaps_in = 6
gaps_out = 12
border_size = 2
col.active_border = rgb(a2bcd1)
col.inactive_border = rgb(1a2332)
layout = dwindle
}
decoration {
rounding = 10
active_opacity = 0.96
inactive_opacity = 0.90
    blur {
enabled = true
size = 6
passes = 3
new_optimizations = true
    }
    shadow {
enabled = true
range = 15
render_power = 3
color = rgba(1a2332ee)
    }
}

#############
### INPUT ###
#############

input {
kb_layout = latam
numlock_by_default = true
kb_variant = 
follow_mouse = 1
    touchpad {
natural_scroll = false
    }
sensitivity = 0
}

####################
### KEY BINDINGS ###
####################

$mainMod = SUPER
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Q, killactive
bind = $mainMod, D, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, M, exit

bind = , Print, exec, hyprshot -m region
bind = $mainMod, Print, exec, hyprshot -m output
bind = $mainMod SHIFT, Print, exec, hyprshot -m window

bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, r
bind = $mainMod, U, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, K, movewindow, r
bind = $mainMod SHIFT, U, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

####################
### WINDOW RULES ###
####################

windowrule = float on, center on, size 500 400, match:class ^(wiremix-float)$
