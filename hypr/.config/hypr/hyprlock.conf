# ~/.config/hypr/hyprlock.conf

$wallpaper = $HOME/Imágenes/Wallpapers/astronaut.png

$font_display = JetBrains Mono Nerd Font Bold
$font_text = JetBrains Mono Nerd Font

$text_primary = rgba(218, 230, 239, 0.95)
$text_secondary = rgba(162, 188, 209, 0.75)
$text_muted = rgba(162, 188, 209, 0.55)
$text_faint = rgba(162, 188, 209, 0.65)
$accent = rgba(162, 188, 209, 0.6)
$alert = rgba(239, 106, 115, 0.8)

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = $text_primary
    font_size = 110
    font_family = $font_display
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d de %B de %Y'
    color = $text_secondary
    font_size = 22
    font_family = $font_text
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    fade_on_empty = false
    outer_color = $accent
    inner_color = rgba(15, 23, 36, 0.4)
    font_color = rgba(255, 255, 255, 0.95)
    fail_color = $alert
    placeholder_text = <span foreground="##a2bcd1" font_style="italic">Introduce contraseña...</span>
    hide_input = false
    position = 0, -30
    halign = center
    valign = center
    rounding = 12
    fail_text = <span foreground="##ef6a73" font_style="italic">Contraseña incorrecta</span>
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}

label {
    monitor =
    text = Hola de nuevo, <span font_weight="bold" foreground="##dae6ef">$USER</span>
    color = $text_muted
    font_size = 16
    font_family = $font_text
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] bash -c 'bat=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -n1); if [ -n "$bat" ]; then printf "󰁹 %s%%" "$(cat "$bat"/capacity)"; else printf "󰁹 N/A"; fi'
    color = $text_faint
    font_size = 14
    font_family = $font_text
    position = -40, 40
    halign = right
    valign = bottom
}