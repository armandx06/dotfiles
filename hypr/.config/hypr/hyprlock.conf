background {
    monitor =
    path = /home/armandx06/Imágenes/Wallpapers/astronaut.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(a2bcd1)
    font_size = 70
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
}

# Mensaje de Bienvenida
label {
    monitor =
    text = Hola, armandx06
    color = rgb(a2bcd1)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Campo de Contraseña
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.15
    dots_fade_time = 200
    fade_on_empty = false
    
    col.active_border = rgb(a2bcd1)
    col.inactive_border = rgb(1a2332)
    col.inside = rgb(1a2332)
    col.font = rgb(a2bcd1)
    
    placeholder_text = <i>Introduce contraseña...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}